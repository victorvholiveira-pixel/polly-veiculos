name: Supabase — deploy automático (schema + dados)

# Executor oficial de produção do Polly: dispara sozinho a cada push em
# `main` que toque em supabase/migrations/** ou supabase/data-migrations/**
# — não precisa clicar em nada para a operação normal (aplicar migrations,
# rodar uma nova data-migration idempotente). `workflow_dispatch` continua
# disponível só como escape hatch manual (reexecutar, ou rodar
# `validate-only` sem esperar um push).
#
# Nunca roda em PR nem em outro branch — só push em main.
on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/data-migrations/**"
  workflow_dispatch:
    inputs:
      action:
        description: "deploy = aplica tudo que estiver pendente. validate-only = só relatório de leitura, não altera nada."
        required: true
        type: choice
        default: deploy
        options:
          - deploy
          - validate-only

permissions:
  contents: read

# Duas execuções nunca mexem no mesmo banco ao mesmo tempo — mesmo se dois
# pushes em main acontecerem em sequência rápida, o segundo espera o
# primeiro terminar (nunca cancela um deploy em andamento).
concurrency:
  group: supabase-deploy-xzcuhrdhccnforqkovof
  cancel-in-progress: false

jobs:
  deploy:
    name: >-
      ${{ github.event_name == 'push' && 'deploy (push em main)' || github.event.inputs.action }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Vinculado ao Environment "production". IMPORTANTE: para este pipeline
    # continuar 100% automático (sem clique nenhum a cada push), este
    # Environment NÃO deve ter "required reviewers" configurado — isso
    # pausaria todo push esperando aprovação manual, o oposto do objetivo.
    # Ele existe aqui por causa do isolamento de secrets (só jobs que
    # declaram este Environment enxergam SUPABASE_ACCESS_TOKEN/
    # SUPABASE_DB_PASSWORD) e do histórico de execuções separado, não para
    # gate de aprovação — ver README.md, "Deploy automático contra o
    # projeto real".
    environment: production
    env:
      # Não é segredo: identificador público do projeto (já aparece na URL
      # `https://xzcuhrdhccnforqkovof.supabase.co`). Só os dois abaixo são
      # credenciais reais.
      PROJECT_REF: xzcuhrdhccnforqkovof
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Supabase CLI (ação oficial)
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Instalar cliente psql
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends postgresql-client

      # Autentica com SUPABASE_ACCESS_TOKEN (mecanismo oficial da CLI para
      # CI) e liga este checkout ao projeto real via project-ref + senha do
      # Postgres. Se o token, o project-ref ou a senha estiverem errados, o
      # job falha aqui — antes de qualquer SQL rodar.
      - name: Autenticar e conectar ao projeto Supabase real
        run: |
          set -euo pipefail
          supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      # A conexão "direta" (db.<ref>.supabase.co:5432) só resolve em IPv6, e
      # runners do GitHub Actions não têm rota de saída IPv6 — confirmado na
      # prática (primeira execução real: "Network is unreachable"). O
      # Session Pooler (Supavisor, porta 5432, compatível com IPv4) é o
      # caminho oficial da própria Supabase para CI/ambientes serverless;
      # precisa da região do projeto, que a Management API devolve.
      - name: Descobrir a região do projeto e exportar conexão via Session Pooler (IPv4)
        run: |
          set -euo pipefail
          region=$(curl -sS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects" \
            | jq -er --arg ref "$PROJECT_REF" '.[] | select(.id == $ref) | .region')
          {
            echo "PGHOST=aws-0-${region}.pooler.supabase.com"
            echo "PGPORT=5432"
            echo "PGUSER=postgres.${PROJECT_REF}"
            echo "PGDATABASE=postgres"
            echo "PGSSLMODE=require"
          } >> "$GITHUB_ENV"
          echo "PGPASSWORD=$SUPABASE_DB_PASSWORD" >> "$GITHUB_ENV"

      # 1) Migrations de schema — só as que ainda não estão no ledger oficial
      # da CLI (supabase_migrations.schema_migrations). Reexecução nunca
      # reaplica uma já aplicada.
      - name: Aplicar migrations de schema pendentes
        if: github.event_name == 'push' || github.event.inputs.action == 'deploy'
        run: |
          set -euo pipefail
          supabase db push --linked | tee /tmp/db-push.log
          {
            echo "### Migrations de schema"
            echo ""
            echo '```'
            cat /tmp/db-push.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 2) Health check pós-schema — read-only, mas roda sempre (também em
      # validate-only) porque é barato e útil como sinal de saúde geral.
      - name: Health check pós-schema
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f scripts/db/health-check.sql | tee /tmp/health-check.log
          {
            echo "### Health check"
            echo ""
            echo '```'
            cat /tmp/health-check.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 3) Data migrations — padrão permanente em supabase/data-migrations/.
      # scripts/db/run-data-migrations.sh só aplica o que ainda não está no
      # ledger public._data_migrations (por nome de arquivo + checksum);
      # cada arquivo valida o próprio resultado e aborta a transação (sem
      # registrar no ledger) se algo não bater — nunca fica "meio aplicado".
      - name: Aplicar data-migrations pendentes
        if: github.event_name == 'push' || github.event.inputs.action == 'deploy'
        run: |
          set -euo pipefail
          chmod +x scripts/db/run-data-migrations.sh
          scripts/db/run-data-migrations.sh | tee /tmp/data-migrations.log
          {
            echo "### Data migrations"
            echo ""
            echo '```'
            cat /tmp/data-migrations.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Só leitura, e roda SEMPRE — inclusive se um passo anterior falhou
      # (`if: always()`), porque é exatamente nesse caso que o relatório
      # mais importa: mostrar o estado real do banco para diagnosticar o
      # que quebrou, sem exigir acesso manual ao projeto para investigar.
      - name: Relatório do ledger (sempre roda, mesmo se algo falhou acima; só leitura)
        if: always()
        run: |
          set +e
          echo "=== supabase migration list --linked ==="
          migration_list=$(supabase migration list --linked 2>&1 | tee /dev/stderr)
          echo "=== ledger de data-migrations ==="
          applied=$(psql -tAc "select coalesce(string_agg(id, E'\n' order by id), '(nenhuma)') from public._data_migrations;" 2>&1 | tee /dev/stderr)
          echo "=== supabase db push --dry-run ==="
          pending_schema=$(supabase db push --linked --dry-run 2>&1 | tee /dev/stderr)
          echo "=== TEMP: diagnostico objeto-a-objeto por migration (remover apos investigacao) ==="
          psql -x -c "
            select
              (select to_regclass('public.vehicles')) is not null as m0200_vehicles,
              (select to_regclass('public.vehicle_occurrences')) is not null as m0300_vehicle_occurrences,
              (select to_regclass('public.vehicle_match_candidates')) is not null as m0400_vehicle_match_candidates,
              (select to_regclass('public.sellers')) is not null as m0500_sellers,
              (select to_regclass('public.sales')) is not null as m0600_sales,
              (select to_regclass('public.app_settings')) is not null as m0700_app_settings,
              (select to_regclass('public.audit_log')) is not null as m0800_audit_log,
              exists(select 1 from information_schema.columns where table_schema='public' and table_name='vehicle_occurrences' and column_name='sale_date_parsed') as m0900_parsed_fields,
              exists(select 1 from information_schema.columns where table_schema='public' and table_name='vehicle_occurrences' and column_name='review_decision') as m1000_review_overlay,
              exists(select 1 from information_schema.columns where table_schema='public' and table_name='vehicle_match_candidates' and column_name='decision') as m1100_decision,
              exists(select 1 from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname='vehicles_guard_sold_transition') as m1200_sold_guard,
              (select to_regclass('public.migration_import_batches')) is not null as m1300_import_batches,
              exists(select 1 from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname='create_initial_inventory') as m1400_create_initial_inventory,
              exists(select 1 from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname='register_sale') as m1500_register_sale,
              exists(select 1 from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname='cancel_sale') as m1600_cancel_sale,
              exists(select 1 from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname='create_vehicle') as m1700_create_vehicle,
              exists(select 1 from information_schema.columns where table_schema='public' and table_name='sales' and column_name='origin') as m1800_sales_origin,
              (select to_regclass('public._data_migrations')) is not null as m1900_data_migrations_ledger
          " 2>&1 | tee /dev/stderr
          set -e
          {
            echo "### supabase migration list --linked (local vs. ledger remoto)"
            echo ""
            echo '```'
            echo "$migration_list"
            echo '```'
            echo ""
            echo "### Ledger de data-migrations aplicadas (public._data_migrations)"
            echo ""
            echo '```'
            echo "$applied"
            echo '```'
            echo ""
            echo "### supabase db push --dry-run (o que ficaria pendente de schema)"
            echo ""
            echo '```'
            echo "$pending_schema"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
